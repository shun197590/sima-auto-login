<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="安防快速登入">
  <title>安防系統快速登入</title>
  <link rel="manifest" href="manifest.json">
  <style>
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body {
      margin: 0; padding: 24px 16px; background-color: #f1f5f9;
      display: flex; flex-direction: column; align-items: center; min-height: 100vh;
    }
    .card {
      background: #ffffff; border-radius: 16px; padding: 24px;
      width: 100%; max-width: 380px; box-shadow: 0 4px 14px rgba(0,0,0,0.08);
    }
    h1 { font-size: 1.25rem; color: #0f172a; margin: 0 0 16px; text-align: center; }
    .badge {
      display: inline-block; background: #e2e8f0; color: #475569;
      font-size: 0.8rem; padding: 4px 10px; border-radius: 999px; margin-bottom: 20px;
    }
    label { font-size: 0.875rem; font-weight: 600; color: #334155; margin-bottom: 6px; display: block; }
    .system-selector {
      display: flex; gap: 8px; margin-bottom: 18px;
    }
    .radio-btn {
      flex: 1; text-align: center; padding: 10px; border: 1.5px solid #cbd5e1;
      border-radius: 8px; font-size: 0.9rem; cursor: pointer; color: #475569;
    }
    input[type="radio"] { display: none; }
    input[type="radio"]:checked + .radio-btn {
      border-color: #2563eb; background: #eff6ff; color: #1d4ed8; font-weight: 600;
    }
    .input-box {
      width: 100%; padding: 12px; font-size: 1.1rem; text-align: center; letter-spacing: 4px;
      border: 1.5px solid #cbd5e1; border-radius: 8px; margin-bottom: 18px; outline: none;
    }
    .input-box:focus { border-color: #2563eb; ring: 2px #93c5fd; }
    .btn-main {
      width: 100%; padding: 14px; background: #2563eb; color: #fff;
      border: none; border-radius: 8px; font-size: 1rem; font-weight: 600;
      cursor: pointer; box-shadow: 0 2px 8px rgba(37,99,235,0.3);
    }
    .btn-main:active { background: #1d4ed8; }
    .btn-sub {
      width: 100%; margin-top: 10px; padding: 10px; background: #f8fafc;
      border: 1px solid #cbd5e1; border-radius: 8px; font-size: 0.85rem; color: #475569; cursor: pointer;
    }
    .toast {
      position: fixed; bottom: 30px; background: rgba(15,23,42,0.9);
      color: #fff; padding: 10px 18px; border-radius: 20px; font-size: 0.85rem;
      opacity: 0; transition: opacity 0.3s; pointer-events: none;
    }
    .toast.show { opacity: 1; }
  </style>
</head>
<body>
  <div class="card">
    <h1>產業園區安全防護</h1>
    <div style="text-align: center;"><span class="badge">帳號：kksp</span></div>

    <label>選擇目標主機</label>
    <div class="system-selector">
      <label style="flex: 1; margin: 0;">
        <input type="radio" name="targetUrl" value="https://security.bip.gov.tw/sima/" checked>
        <div class="radio-btn">正式系統</div>
      </label>
      <label style="flex: 1; margin: 0;">
        <input type="radio" name="targetUrl" value="https://bipsimabackup.eric.org.tw/">
        <div class="radio-btn">備援系統</div>
      </label>
    </div>

    <label>輸入動態密碼 (5 位數字)</label>
    <input type="password" id="pinInput" class="input-box" inputmode="numeric" maxlength="5" placeholder="•••••">

    <button class="btn-main" onclick="executeLogin()">複製完整密碼並開啟</button>
    <button class="btn-sub" onclick="copyAccount()">僅複製帳號 (kksp)</button>
  </div>

  <div id="toast" class="toast">已複製密碼！正在前往系統...</div>

  <script>
    function showToast(text) {
      const toast = document.getElementById('toast');
      toast.innerText = text;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 2000);
    }

    async function executeLogin() {
      const pin = document.getElementById('pinInput').value.trim();
      if (pin.length !== 5 || !/^\d{5}$/.test(pin)) {
        alert('請輸入完整的 5 位阿拉伯數字');
        return;
      }

      const fullPassword = `Kspo@${pin}#`;
      const selectedUrl = document.querySelector('input[name="targetUrl"]:checked').value;

      try {
        await navigator.clipboard.writeText(fullPassword);
        showToast('密碼已複製！即將跳轉...');
      } catch (err) {
        prompt('剪貼簿自動寫入失敗，請手動複製密碼：', fullPassword);
      }

      setTimeout(() => {
        window.location.href = selectedUrl;
      }, 500);
    }

    async function copyAccount() {
      try {
        await navigator.clipboard.writeText('kksp');
        showToast('帳號 kksp 已複製');
      } catch (e) {
        alert('複製失敗，請手動輸入');
      }
    }
  </script>
</body>
</html>
