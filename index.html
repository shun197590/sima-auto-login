<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>產業園區安防 - 一鍵快速啟動</title>
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="安防一鍵登入">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="icon" type="image/png" href="icon-192.png">
  <style>
    :root {
      --primary: #00707c;
      --primary-hover: #005a63;
      --bg: #f8fafc;
      --card: #ffffff;
      --border: #e2e8f0;
      --text: #0f172a;
      --muted: #64748b;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
    body { background: var(--bg); color: var(--text); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 16px; }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 16px; max-width: 400px; width: 100%; padding: 24px 20px; box-shadow: 0 10px 25px -5px rgba(0,0,0,0.06); }
    .header { text-align: center; margin-bottom: 20px; }
    .header h1 { font-size: 1.2rem; font-weight: 700; }
    .header p { font-size: 0.825rem; color: var(--muted); margin-top: 4px; }
    .status-badge { display: inline-flex; align-items: center; gap: 6px; background: #ecfdf5; color: #047857; font-size: 0.8rem; font-weight: 600; padding: 4px 12px; border-radius: 999px; margin-top: 8px; }
    .status-badge::before { content: ""; width: 7px; height: 7px; background: #10b981; border-radius: 50%; }
    .cred-box { background: #f1f5f9; border-radius: 10px; padding: 14px; margin-bottom: 20px; }
    .cred-row { display: flex; justify-content: space-between; align-items: center; font-size: 0.875rem; margin-bottom: 8px; }
    .cred-row:last-child { margin-bottom: 0; }
    .cred-label { color: var(--muted); }
    .cred-val { font-family: monospace; font-weight: 700; color: var(--text); font-size: 0.95rem; }
    .btn-group { display: flex; flex-direction: column; gap: 12px; }
    .btn { height: 48px; border-radius: 10px; border: none; font-size: 0.95rem; font-weight: 600; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; transition: 0.15s ease; text-decoration: none; }
    .btn-primary { background: var(--primary); color: #fff; box-shadow: 0 4px 12px rgba(0, 112, 124, 0.25); }
    .btn-primary:active { background: var(--primary-hover); transform: scale(0.99); }
    .btn-outline { background: #fff; border: 1.5px solid var(--border); color: #334155; }
    .btn-outline:active { background: #f8fafc; }
    .tip-box { margin-top: 20px; padding-top: 14px; border-top: 1px solid var(--border); font-size: 0.775rem; color: var(--muted); line-height: 1.5; }
    .toast { position: fixed; bottom: 24px; background: rgba(15, 23, 42, 0.92); color: #fff; font-size: 0.85rem; padding: 10px 18px; border-radius: 20px; opacity: 0; transform: translateY(10px); transition: 0.25s ease; pointer-events: none; z-index: 100; }
    .toast.show { opacity: 1; transform: translateY(0); }
  </style>
</head>
<body>
  <div class="card">
    <div class="header">
      <h1>產業園區安全防護系統</h1>
      <p>一鍵複製密碼並自動前往登入頁</p>
      <div class="status-badge">全自動．無需輸入密碼</div>
    </div>

    <div class="cred-box">
      <div class="cred-row">
        <span class="cred-label">帳號</span>
        <span class="cred-val">kksp</span>
      </div>
      <div class="cred-row">
        <span class="cred-label">已綁定密碼</span>
        <span class="cred-val">Kspo@151766#</span>
      </div>
    </div>

    <div class="btn-group">
      <button class="btn btn-primary" onclick="launchSystem('https://security.bip.gov.tw/sima/')">
        一鍵前往【正式系統】
      </button>
      <button class="btn btn-outline" onclick="launchSystem('https://bipsimabackup.eric.org.tw/')">
        一鍵前往【備援系統】
      </button>
    </div>

    <div class="tip-box">
      <strong>操作提示：</strong>
      <ol style="margin-top: 4px; padding-left: 18px;">
        <li>點擊按鈕會自動將完整密碼寫入剪貼簿，並立即開啟系統頁面。</li>
        <li>跳轉至登入頁後：帳號欄輸入 <code>kksp</code>，密碼欄直接「貼上」。</li>
        <li>輸入圖形驗證碼即可完成登入。</li>
      </ol>
    </div>
  </div>

  <div id="toast" class="toast">密碼已複製！即將前往...</div>

  <script>
    const DEFAULT_PASSWORD = "Kspo@151766#";

    function showToast(text) {
      const t = document.getElementById('toast');
      t.innerText = text;
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 2000);
    }

    async function copyToClipboard(text) {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        return navigator.clipboard.writeText(text);
      } else {
        const ta = document.createElement("textarea");
        ta.value = text;
        ta.style.position = "fixed";
        ta.style.opacity = "0";
        document.body.appendChild(ta);
        ta.focus();
        ta.select();
        document.execCommand('copy');
        document.body.removeChild(ta);
        return Promise.resolve();
      }
    }

    async function launchSystem(url) {
      try {
        await copyToClipboard(DEFAULT_PASSWORD);
        showToast('密碼已複製！即將前往...');
      } catch(e) {
        console.log('Clipboard error');
      }
      setTimeout(() => {
        window.location.href = url;
      }, 350);
    }

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(() => {});
      });
    }
  </script>
</body>
</html>
